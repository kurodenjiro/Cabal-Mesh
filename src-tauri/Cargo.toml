# This manifest is both the workspace root and the Tauri app package. Tauri
# expects its package at src-tauri/, so the workspace lives here rather than at
# the repo root.
#
# Extracted crates go in crates/ and must not depend on this package — the
# dependency arrow points inward, toward the domain.
[workspace]
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[package]
name = "cabalmesh"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cabalmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The domain model. No I/O, no runtime — see crates/cabal-core/src/lib.rs.
cabal-core = { path = "crates/cabal-core" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# Mesh Networking (libp2p)
libp2p = { version = "0.54", features = ["tcp", "mdns", "noise", "yamux", "gossipsub", "tokio"] }
libp2p-swarm = { version = "0.45", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# HTTP client.
#
# rustls, not native-tls: Android ships no system OpenSSL, so a native-tls
# build either fails to link or fails at runtime on device.
#
# Version tracks alloy's transport (0.13) so exactly one reqwest major exists
# in the tree. The repo previously carried 0.11 here against alloy's 0.13,
# compiling two full HTTP stacks.
# NB: 0.13 renamed the rustls feature from `rustls-tls` to `rustls`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

# Additional utilities
futures = "0.3"
async-trait = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Trimmed from "full", which pulls the entire alloy ecosystem across seven
# target triples. These are the features the bridge actually calls.
alloy = { version = "1", default-features = false, features = [
    "std",
    "consensus",
    "contract",
    "eips",
    "json-abi",
    "network",
    "provider-http",
    # `provider-http` only supplies the transport type. `ProviderBuilder::connect_http`
    # additionally needs the reqwest backend, which is this separate feature.
    "reqwest",
    "rpc-types-eth",
    "signer-local",
    "sol-types",
] }

rand = "0.9.2"
aes-gcm = "0.10.3"
base64 = "0.22.1"
dirs = "5"
lopdf = "0.44"

# Desktop-only. A mobile bundle has no .env file to read and no environment to
# read it into, so this must never enter the mobile dependency graph.
#
# Cargo has no "target-conditional workspace member" or cfg(desktop)-gated
# dependency — Tauri's cfg values are set by tauri-build, far too late to
# influence resolution. Target-specific dependencies are the mechanism that
# actually works.
#
# The full replacement (a compiled-in per-network address table) is ticket 24;
# this keeps the local desktop dev workflow intact until then.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dotenv = "0.15.0"

[dev-dependencies]
insta = "1.48.0"

