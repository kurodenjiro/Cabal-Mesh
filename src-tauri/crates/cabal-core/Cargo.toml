[package]
name = "cabal-core"
version = "0.1.0"
edition = "2021"
description = "CabalMesh domain model: intents, money, identifiers. No I/O."
publish = false

[dependencies]
# Deliberately minimal. This crate must not gain tauri, tokio, reqwest, alloy
# or libp2p — see the module docs in src/lib.rs for why that constraint is
# load-bearing rather than stylistic.
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }

[lints]
workspace = true
