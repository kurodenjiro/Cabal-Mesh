# Pin a stable toolchain.
#
# The repo was previously building on whatever nightly happened to be the
# rustup default. Nightly is an unnecessary variable in a build that has to
# cross-compile to seven target triples; a moving compiler turns a mobile
# link failure into a question about which thing changed.
#
# Targets listed here are installed automatically by rustup. iOS is complete;
# the four Android triples are added by ticket 08 once the SDK/NDK exist.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
]
